name: Publish version

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version in VERSION and CHANGELOG.md (e.g. 0.1.0, without v)'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: publish-version
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Validate release metadata
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          test "$GITHUB_REF" = refs/heads/main || { echo 'Run releases from main.'; exit 1; }
          python3 Scripts/validate-release.py "$RELEASE_VERSION"

  test:
    needs: validate
    uses: ./.github/workflows/ci.yml

  publish:
    needs: [validate, test]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Create version tag and GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          python3 Scripts/validate-release.py "$RELEASE_VERSION"
          # Ref creation fails if the tag already exists; never overwrite a release.
          gh api --method POST "repos/$GH_REPO/git/refs" \
            -f "ref=refs/tags/$RELEASE_VERSION" -f "sha=$GITHUB_SHA"
          gh release create "$RELEASE_VERSION" --verify-tag \
            --title "JevKit $RELEASE_VERSION" --generate-notes
