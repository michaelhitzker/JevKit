name: Publish version

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version in VERSION (e.g. 0.1.0, without v)'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: publish-version
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Validate release metadata
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          test "$GITHUB_REF" = refs/heads/main || { echo 'Run releases from main.'; exit 1; }
          python3 Scripts/validate-release.py "$RELEASE_VERSION"

  test:
    needs: validate
    uses: ./.github/workflows/ci.yml

  publish:
    needs: [validate, test]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: true
      - name: Create version tag and GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          python3 Scripts/validate-release.py "$RELEASE_VERSION"
          # Refuse stale runs; never publish over newer main commits.
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$GITHUB_SHA"
          python3 Scripts/generate-changelog.py "$RELEASE_VERSION" --notes "$RUNNER_TEMP/release-notes.md"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add CHANGELOG.md
          if ! git diff --cached --quiet; then
            git commit -m "chore(release): $RELEASE_VERSION"
          fi
          git tag "$RELEASE_VERSION"
          # Both refs advance together, or neither does. Never force a tag or branch.
          git push --atomic origin HEAD:refs/heads/main "refs/tags/$RELEASE_VERSION"
          gh release create "$RELEASE_VERSION" --verify-tag \
            --title "JevKit $RELEASE_VERSION" --notes-file "$RUNNER_TEMP/release-notes.md"
